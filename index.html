<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Minute Forever</title><style>
:root{color-scheme:dark;--bg:#11151b;--panel:#1b232d;--ink:#f3f1e9;--muted:#a7b4bf;--accent:#d5ef85}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100dvh}main{max-width:760px;margin:auto;padding:32px 20px}h1{font-size:clamp(36px,8vw,70px);line-height:.98;letter-spacing:-.06em;margin:12px 0 24px}h2{font-size:26px;line-height:1.2}p{color:var(--muted)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}.panel{background:var(--panel);padding:24px;border-radius:22px;margin-top:16px;border:1px solid #ffffff12}button,input{font:inherit;border-radius:12px;padding:14px 18px}button{cursor:pointer;border:0;background:var(--accent);color:#182013;font-weight:700;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:default}button.secondary{background:#2d3947;color:var(--ink)}input{width:100%;border:1px solid #43505c;background:#11151b;color:var(--ink);margin:5px 0 12px}label{display:block;font-size:14px;color:var(--muted)}.wide{width:100%}.code{font-size:40px;letter-spacing:.15em;font-weight:800;color:var(--accent)}.center{text-align:center}.submit{display:block;width:min(72vw,300px);height:min(72vw,300px);border-radius:50%;margin:35px auto;background:#34453f;color:#f3f1e9;font-size:28px;outline:none;user-select:none}.submit:active,.submit:focus{background:#34453f;outline:none;box-shadow:none}.riddle{font-size:clamp(24px,5vw,42px);line-height:1.24;font-weight:650;letter-spacing:-.03em}.error{color:#ffb3a7;min-height:1.5em;font-size:14px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}th,td{text-align:right;padding:10px 5px;border-bottom:1px solid #ffffff19}th:first-child,td:first-child{text-align:left}th{color:var(--muted)}.scroll{overflow-x:auto}.footer{margin-top:30px;font-size:12px;color:var(--muted)}#leave{margin-top:24px;font-size:13px}
</style></head><body><main><div class="eyebrow">An experiment in time perception</div><h1>One Minute<br>Forever.</h1><div id="app"></div><div id="error" class="error" role="alert"></div><button id="leave" class="secondary" hidden>Leave this device</button><div class="footer">Target: 120 seconds · Three rounds · Results hidden until the end</div></main><script>
const app=document.querySelector('#app'),err=document.querySelector('#error'),leave=document.querySelector('#leave');let session=null,state=null,renderKey='',busy=false,submittedRound=0,wake=null,polling=false;try{session=JSON.parse(sessionStorage.getItem('omf-session'))}catch{};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,extra={}){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Connection error');return d;}
function save(s){session=s;submittedRound=0;sessionStorage.setItem('omf-session',JSON.stringify(s));renderKey='';refresh()}
function home(){leave.hidden=true;app.innerHTML='<div class="panel"><h2>Host a game</h2><p>Use one computer to start all rounds and reveal scores at the end.</p><button class="wide" id="create">Create room</button></div><form class="panel" id="join"><h2>Join as a player</h2><label>Room code<input name="code" required maxlength="6" autocomplete="off" autocapitalize="characters"></label><label>Player name<input name="name" required maxlength="24" autocomplete="off"></label><button class="wide">Join room</button></form>';document.querySelector('#create').onclick=async()=>{if(busy)return;busy=true;try{save(await api('create'))}catch(e){err.textContent=e.message}finally{busy=false}};document.querySelector('#join').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{save(await api('join',Object.fromEntries(new FormData(e.target))))}catch(e){err.textContent=e.message}finally{busy=false}};}
async function keepAwake(){try{if('wakeLock' in navigator&&(!wake||wake.released))wake=await navigator.wakeLock.request('screen')}catch{}}
function render(s){const key=JSON.stringify(s);if(key===renderKey)return;renderKey=key;state=s;leave.hidden=s.phase==='running';const label=['','Silent waiting','Free conversation','Group riddle'];const instructions=['','Stay quiet and do nothing.','Talk freely with the other players.','Discuss the riddle together. Keep thinking or discussing after you submit.'];
if(s.phase==='lobby'){app.innerHTML=s.host?`<div class="panel"><div class="eyebrow">Room code</div><div class="code">${esc(s.code)}</div><p>Players open this website on their phones and enter this code.</p><h2>${s.count} players connected</h2><p>${s.names.map(esc).join(' · ')||'Waiting for players…'}</p><button id="start" class="wide" ${s.count<2?'disabled':''}>Start round 1</button></div>`:`<div class="panel center"><div class="eyebrow">Room ${esc(s.code)}</div><h2>You're in, ${esc(s.name)}.</h2><p>Wait for the host. Keep your phone hidden when the round begins.</p><button id="awake" class="secondary">Keep screen awake</button></div>`;}
else if(s.phase==='running'){app.innerHTML=s.host?`<div class="panel"><div class="eyebrow">Round ${s.round} / 3 · In progress</div><h2>${label[s.round]}</h2>${s.puzzle?`<div class="riddle">${esc(s.puzzle)}</div><p>Read the riddle aloud once. Do not reveal the answer.</p>`:`<p>${instructions[s.round]}</p>`}<p>All timing and submission information is hidden.</p></div>`:`<div class="panel center"><div class="eyebrow">Round ${s.round} / 3</div><h2>${label[s.round]}</h2><p>${instructions[s.round]}</p>${s.puzzle?`<p>${esc(s.puzzle)}</p>`:''}<button id="submit" class="submit" aria-label="Secretly submit your estimate">Submit</button><p>Tap once when you think two minutes have passed. Continue the activity. The button will not change.</p></div>`;}
else if(s.phase==='between'){app.innerHTML=`<div class="panel center"><div class="eyebrow">Round ${s.round} complete</div><h2>Next: ${label[s.round+1]}</h2><p>${instructions[s.round+1]}</p><p>Scores remain hidden.</p>${s.host?`<button id="start" class="wide">Start round ${s.round+1}</button>`:'<p>Wait for the host.</p>'}</div>`;}
else if(s.phase==='finished'){app.innerHTML=s.host?`<div class="panel"><div class="eyebrow">Final results</div><h2>${esc(s.results.filter(x=>x.error===s.results[0].error).map(x=>x.name).join(' & '))} wins!</h2><p>Lowest total absolute error wins. All times are in seconds; missed submissions count as 300 seconds.</p><div class="scroll"><table><thead><tr><th>Player</th><th>R1</th><th>R2</th><th>R3</th><th>Error</th></tr></thead><tbody>${s.results.map(p=>`<tr><td>${esc(p.name)}</td>${p.scores.map(x=>`<td>${x===null?'Missed':x.toFixed(2)}</td>`).join('')}<td>${p.error.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><h2>Riddle answer</h2><p>${esc(s.answer)}</p></div><button class="wide secondary" id="new" style="margin-top:16px">Create another room</button>`:'<div class="panel center"><h2>Game complete</h2><p>The host can now reveal the results.</p></div>';}
const start=document.querySelector('#start');if(start)start.onclick=async()=>{if(busy)return;busy=true;try{render(await api('start'))}catch(e){err.textContent=e.message}finally{busy=false}};
const sub=document.querySelector('#submit');if(sub)sub.onclick=async()=>{if(submittedRound===s.round)return;try{await api('submit',{round:s.round});submittedRound=s.round}catch(e){}};
const awake=document.querySelector('#awake');if(awake)awake.onclick=()=>{keepAwake();awake.textContent='Keep awake requested';};const fresh=document.querySelector('#new');if(fresh)fresh.onclick=async()=>{try{save(await api('create'))}catch(e){err.textContent=e.message}};
}
async function refresh(){if(!session||polling||busy)return;polling=true;const token=session.token;try{const s=await api('state');if(session&&session.token===token&&!busy){render(s);err.textContent=''}}catch(e){err.textContent=e.message;leave.hidden=false}finally{polling=false}}
leave.onclick=()=>{session=null;state=null;renderKey='';submittedRound=0;sessionStorage.removeItem('omf-session');err.textContent='';home()};document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();refresh()}});if(session)refresh();else home();setInterval(refresh,500);
</script></body></html>
